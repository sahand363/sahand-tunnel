
name: Sahand Tunnel Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: web
        run: npm install

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Run tests
        run: go test ./...

  build:
    name: Build Linux binaries
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: web
        run: npm install

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Set application version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi

          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building version: $VERSION"

      - name: Build AMD64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build \
            -trimpath \
            -ldflags "-s -w -X main.AppVersion=${APP_VERSION}" \
            -o dist/sahand-tunnel-linux-amd64 \
            ./cmd/sahand-tunnel

      - name: Build ARM64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          go build \
            -trimpath \
            -ldflags "-s -w -X main.AppVersion=${APP_VERSION}" \
            -o dist/sahand-tunnel-linux-arm64 \
            ./cmd/sahand-tunnel

      - name: Generate SHA256 checksums
        working-directory: dist
        run: |
          sha256sum sahand-tunnel-linux-amd64 \
                    sahand-tunnel-linux-arm64 \
                    > SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sahand-tunnel-${{ env.APP_VERSION }}
          path: dist/*
          retention-days: 14

      - name: Publish development release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -f dev "$GITHUB_SHA"
          git push --force origin refs/tags/dev

          if gh release view dev >/dev/null 2>&1; then
            gh release upload dev dist/* --clobber
            gh release edit dev \
              --title "Sahand Tunnel Development Build" \
              --prerelease
          else
            gh release create dev dist/* \
              --target "$GITHUB_SHA" \
              --title "Sahand Tunnel Development Build" \
              --notes "Automatically updated development build." \
              --prerelease
          fi

      - name: Publish stable release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --verify-tag \
              --title "$TAG" \
              --notes "Sahand Tunnel ${TAG}"
          fi
